# ModaFlow — staging stack (Coolify, "Docker Compose" build pack).
#
# Mirrors deploy/production/compose.yaml (same images, NODE_ENV=production) so
# what passes in staging behaves the same in production. Differences only:
#   - APP_ENV=staging (reported by GET /health)
#   - staging domains as defaults
#   - Swagger enabled by default
#   - its own database volume (separate Coolify resource => separate data)
# Keep both files in sync when changing services.
#
# Coolify:
#   Base Directory:          /deploy/staging
#   Docker Compose Location: /compose.yaml
#   Domains (set per service in the Coolify UI):
#     web -> https://staging.modaflow.amicornios.com:3000
#     api -> https://api.staging.modaflow.amicornios.com:3001
#     admin-web -> https://admin.staging.modaflow.amicornios.com:3000
#     admin-api, postgres, migrate -> no domain (private network only)
#
# Local check from the repository root:
#   docker compose -f deploy/staging/compose.yaml --env-file .env config
#
# No ports are published: Coolify's proxy routes traffic to web/api, and
# PostgreSQL is reachable only through the private network.
name: modaflow-staging

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-modaflow}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - modaflow

  # One-shot job on every deploy: applies pending migrations (never drops data),
  # creates missing plans and sets the passwords of the restricted database
  # roles. It is the only service that uses the database owner account.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/cli/provision-db-roles.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-modaflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD is required}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modaflow

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://modaflow_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      # Encrypts the S3, Claude and SMTP secrets saved from the admin panel. Never change it once in use.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ModaFlow}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.modaflow.amicornios.com}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      # Public web URL, used to build password-reset links.
      WEB_APP_URL: ${WEB_APP_URL:-https://staging.modaflow.amicornios.com}
      # Claude API (garment recognition). Without a key, AI analysis is disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # S3-compatible storage for product photos (AWS S3, Cloudflare R2, MinIO...).
      # Without bucket/credentials, photo upload is disabled. Use a different bucket than production.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_PUBLIC_URLS: ${S3_PUBLIC_URLS:-}
    expose:
      - "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - modaflow

  # Admin API: no public domain. Only admin-web reaches it over the private network.
  admin-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    command: ["node", "dist/admin-main.js"]
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://modaflow_admin:${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      # Encrypts the S3, Claude and SMTP secrets saved from the admin panel. Never change it once in use.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ModaFlow}
      CORS_ORIGINS: ${ADMIN_WEB_URL:-https://admin.staging.modaflow.amicornios.com}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-https://admin.staging.modaflow.amicornios.com}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-8}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-60}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SWAGGER_ENABLED: "false"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_PUBLIC_URLS: ${S3_PUBLIC_URLS:-}
    expose:
      - "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - modaflow

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # Inlined into the browser bundle at build time (public value).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.staging.modaflow.amicornios.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side calls from Next.js to the API over the internal network.
      API_INTERNAL_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - modaflow

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ADMIN_API_INTERNAL_URL: http://admin-api:3001
    expose:
      - "3000"
    depends_on:
      admin-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - modaflow

networks:
  modaflow:
    driver: bridge

volumes:
  postgres_data:
