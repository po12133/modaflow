# ModaFlow — local development stack (hot reload).
#
# From the repository root:
#   docker compose -f deploy/development/compose.yaml up -d --build
#
# Optional overrides: pass the root .env with `--env-file .env` (see .env.example).
# Each service only receives the variables listed explicitly below, so the web
# container never sees database credentials. Defaults are for local development
# only — never reuse them in production.
name: modaflow-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modaflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-modaflow}
    ports:
      # Bound to localhost only, for local DB clients (psql, Prisma Studio...).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - modaflow

  # S3-compatible object storage for product photos (development only).
  # Production uses an external S3 provider (AWS S3, Cloudflare R2...).
  storage:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-modaflow-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-modaflow-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"modaflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=100
    ports:
      # Bound to localhost: the browser opens signed photo URLs on this port.
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - modaflow

  # One-shot: applies migrations, loads missing plans and sets the passwords of
  # the restricted database roles. Only this service uses the owner account.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: "no"
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run db:roles"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-modaflow}:${POSTGRES_PASSWORD:-modaflow_dev_password}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-modaflow_app_dev_password}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-modaflow_admin_dev_password}
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/prisma:/app/apps/api/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modaflow

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://modaflow_app:${APP_DB_PASSWORD:-modaflow_app_dev_password}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      # Used to build password-reset links.
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      # Claude API (garment recognition). Without a key the AI button is disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # S3-compatible storage: the local `storage` service (SeaweedFS) in development.
      S3_ENDPOINT: http://storage:8333
      # Signed URLs are opened by the browser, so they must use the host port.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-modaflow-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-modaflow-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-modaflow-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"
      # Polling watchers: Docker Desktop bind mounts do not forward file events.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/prisma:/app/apps/api/prisma
      - ../../apps/api/test:/app/apps/api/test
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - modaflow

  # Admin API: separate process, separate database role, no public domain.
  admin-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npm run start:admin"]
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://modaflow_admin:${ADMIN_DB_PASSWORD:-modaflow_admin_dev_password}@postgres:5432/${POSTGRES_DB:-modaflow}?schema=public
      CORS_ORIGINS: ${ADMIN_WEB_URL:-http://localhost:3002}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:3002}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-modaflow-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-modaflow-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-modaflow-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      # Localhost only, for Swagger during development. Never published in production.
      - "127.0.0.1:${ADMIN_API_HOST_PORT:-3003}:3001"
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/prisma:/app/apps/api/prisma
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - modaflow

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Server-side calls from Next.js to the API over the internal network.
      API_INTERNAL_URL: http://api:3001
      # Public API URL (Swagger links, future browser calls).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      WATCH_POLL_INTERVAL_MS: ${WATCH_POLL_INTERVAL_MS:-1000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ../../apps/web/src:/app/apps/web/src
      - ../../apps/web/public:/app/apps/web/public
      - ../../packages/ui/src:/app/packages/ui/src
    depends_on:
      api:
        condition: service_started
    networks:
      - modaflow

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ADMIN_API_INTERNAL_URL: http://admin-api:3001
      WATCH_POLL_INTERVAL_MS: ${WATCH_POLL_INTERVAL_MS:-1000}
    ports:
      - "${ADMIN_WEB_HOST_PORT:-3002}:3000"
    volumes:
      - ../../apps/admin-web/src:/app/apps/admin-web/src
      - ../../apps/admin-web/public:/app/apps/admin-web/public
      - ../../packages/ui/src:/app/packages/ui/src
    depends_on:
      admin-api:
        condition: service_started
    networks:
      - modaflow

networks:
  modaflow:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
